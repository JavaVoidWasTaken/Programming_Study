<!DOCTYTPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport">
    <title>Mini Project 3</title>
  </head>
  <body>
    <form method="POST" action="output.php">
      <label>Name:</label>
      <input type="text" name="name">
      <br>
      <label>Date of Birth:</label>
      <input type="date" name="dateofbirth">
      <br>
      <label>Address:</label>
      <input type="text" name="address">
      <br>
      <label>Gender:</label>
      <input type="radio" name="gender" value="male">Male
      <input type="radio" name="gender" value="female">Female
      <br>
      <label>Email:</label>
      <input type="email" name="email">
      <br><br>

      <label>Airline Booking Code:</label>
      <input type="text" name="airlinebookingcode">
      <br>
      <label>Flight Number:</label>
      <input type="text" name="flightnumber">
      <br>
      <label>From:</label>
      <input type="text" name="from">
      <br>
      <label>To:</label>
      <input type="text" name="to">
      <br>
      <label>Departure Date:</label>
      <input type="date" name="departuredate">
      <br>
      <label>Class:</label>
      <input type="radio" name="class" value="economy">Economy (15$)
      <input type="radio" name="class" value="business">Business (30$)
      <input type="radio" name="class" value="firstclass">First Class (999999999999$)
      <br><br>

      <input type="submit" name="send" value="SEND">
    </form>
  </body>
</html>
